<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mở ra ik<3 💌</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  overflow-x: hidden;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle, #41132f, #100817);
  color: white;
}

h1 {
  font-size: clamp(25px, 6vw, 40px);
  text-shadow: 0 0 20px #ff3caa;
}

.container {
  width: 100%;
  text-align: center;
  padding: 20px;
  margin: auto;
}

.envelope {
  position: relative;
  width: min(300px, 80vw);
  height: 190px;
  margin: 200px auto 45px; /* chừa chỗ cho lá thư bay lên */
  background: #e879b0;
  border-radius: 8px;
  perspective: 900px;
  cursor: pointer;
  filter: drop-shadow(0 15px 25px #0008);
}

.back {
  position: absolute;
  inset: 0;
  background: #d85c98;
  border-radius: 8px;
}

.letter {
  position: absolute;
  z-index: 2;
  left: 5%;
  top: 10%;
  width: 90%;
  height: 85%;
  padding: 16px 14px;
  background: #fff8ed;
  color: #8c3563;
  border-radius: 5px;
  transform: translateY(0);
  transition: transform 1s, height 1s;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  text-align: left;
}

.letter h2 {
  font-family: Georgia, serif;
  margin: 0 0 8px;
  font-size: 20px;
  text-align: center;
}

.letter textarea {
  flex: 1;
  width: 100%;
  border: none;
  outline: none;
  resize: none;
  background: transparent;
  color: #63304c;
  font-size: 15px;
  line-height: 1.6;
  font-family: Georgia, serif;
}

.fr
